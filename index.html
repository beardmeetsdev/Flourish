<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flourish Assessment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Flourishing Assessment</h1>
      <p class="subtitle">Rate each statement from Never (0) to Every Day (5).</p>
    </header>

    <form id="assessment-form"></form>

    <section id="result-card" class="card result initial">
      <h2>Today's Result</h2>
      <p class="muted">Submit today's assessment to see your result.</p>
      <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    <section class="card history">
      <h2>History</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
